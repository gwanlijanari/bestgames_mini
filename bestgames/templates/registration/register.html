<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=6" />
  </head>
  <body>
    <main class="register">
      <div class="register">
        <h1>Регистрация</h1>

        {% if form.errors %}
          <div class="form-errors" style="color: #ff4d4d; margin-bottom: 15px; text-align: left;">
            <p><strong>Пожалуйста, исправьте следующие ошибки:</strong></p>
            {{ form.errors }}
          </div>
        {% endif %}

        <form method="post">
          {% csrf_token %} 
          {{ form.as_p }}
          <button type="submit">Зарегистрироваться</button>
        </form>
        <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
      </div>
    </main>
  </body>
</html>
